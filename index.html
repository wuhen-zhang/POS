<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梅花易數 | 簡易占卜工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .trigram-symbol {
            font-size: 4rem;
            line-height: 1;
            margin: 10px 0;
            color: #d4af37; /* 金色 */
        }
        .card {
            background: #262626;
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full card rounded-2xl p-8">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-yellow-600 mb-2">梅花易數</h1>
            <p class="text-sm text-gray-400 italic">—— 簡易版：判斷事之成敗 ——</p>
        </header>

        <div class="space-y-6">
            <div class="flex gap-4">
                <div class="flex-1 text-center">
                    <label class="block text-xs text-gray-500 mb-1">數字 a (上卦)</label>
                    <input type="number" id="numA" class="w-full bg-transparent border-b border-gray-600 text-center text-xl p-2 focus:border-yellow-600 outline-none" placeholder="0-9">
                </div>
                <div class="flex-1 text-center">
                    <label class="block text-xs text-gray-500 mb-1">數字 b (下卦)</label>
                    <input type="number" id="numB" class="w-full bg-transparent border-b border-gray-600 text-center text-xl p-2 focus:border-yellow-600 outline-none" placeholder="0-9">
                </div>
                <div class="flex-1 text-center">
                    <label class="block text-xs text-gray-500 mb-1">數字 c (動爻)</label>
                    <input type="number" id="numC" class="w-full bg-transparent border-b border-gray-600 text-center text-xl p-2 focus:border-yellow-600 outline-none" placeholder="任一數">
                </div>
            </div>

            <button onclick="calculateDivination()" class="w-full py-3 bg-yellow-700 hover:bg-yellow-600 text-white rounded-lg font-bold transition-all duration-300">
                開始占卜
            </button>
            <button onclick="randomNums()" class="w-full py-1 text-xs text-gray-500 hover:text-gray-300 transition-colors">
                隨機取數
            </button>
        </div>

        <div id="resultArea" class="mt-10 hidden border-t border-gray-700 pt-8 animate-fade-in">
            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="p-4 rounded-lg bg-black bg-opacity-20">
                    <span class="text-xs text-gray-500">【因】本卦</span>
                    <div id="causeSymbol" class="trigram-symbol"></div>
                    <div id="causeName" class="text-lg font-bold"></div>
                    <div id="causeElement" class="text-sm text-yellow-600"></div>
                </div>
                <div class="p-4 rounded-lg bg-black bg-opacity-20 border border-yellow-900">
                    <span class="text-xs text-gray-500">【果】變卦</span>
                    <div id="resultSymbol" class="trigram-symbol"></div>
                    <div id="resultName" class="text-lg font-bold"></div>
                    <div id="resultElement" class="text-sm text-yellow-600"></div>
                </div>
            </div>

            <div class="mt-8 text-center p-6 rounded-xl bg-yellow-900 bg-opacity-10">
                <div class="text-sm text-gray-400 mb-1">生剋結果</div>
                <div id="logicText" class="text-md mb-2"></div>
                <div id="finalJudgment" class="text-3xl font-bold text-yellow-500"></div>
            </div>
        </div>
    </div>

    <script>
        // 卦象資料表 (根據圖三)
        const trigrams = {
            1: { name: "乾", symbol: "☰", element: "金" },
            9: { name: "乾", symbol: "☰", element: "金" },
            2: { name: "兌", symbol: "☱", element: "金" },
            3: { name: "離", symbol: "☲", element: "火" },
            4: { name: "震", symbol: "☳", element: "木" },
            5: { name: "巽", symbol: "☴", element: "木" },
            6: { name: "坎", symbol: "☵", element: "水" },
            7: { name: "艮", symbol: "☶", element: "土" },
            8: { name: "坤", symbol: "☷", element: "土" },
            0: { name: "坤", symbol: "☷", element: "土" }
        };

        // 五行生剋邏輯
        const checkRelation = (eResult, eCause) => {
            const sheng = { "木": "火", "火": "土", "土": "金", "金": "水", "水": "木" };
            const ke = { "木": "土", "火": "金", "土": "水", "金": "木", "水": "火" };

            if (sheng[eResult] === eCause) return { text: "果生因", level: "大吉" };
            if (sheng[eCause] === eResult) return { text: "因生果", level: "小凶" };
            if (ke[eResult] === eCause) return { text: "果剋因", level: "大凶" };
            if (ke[eCause] === eResult) return { text: "因剋果", level: "小吉" };
            return { text: "不生不剋", level: "中吉" };
        };

        // 隨機取數功能
        function randomNums() {
            document.getElementById('numA').value = Math.floor(Math.random() * 10);
            document.getElementById('numB').value = Math.floor(Math.random() * 10);
            document.getElementById('numC').value = Math.floor(Math.random() * 100);
            calculateDivination();
        }

        function calculateDivination() {
            const a = parseInt(document.getElementById('numA').value);
            const b = parseInt(document.getElementById('numB').value);
            let c = parseInt(document.getElementById('numC').value);

            if (isNaN(a) || isNaN(b) || isNaN(c)) {
                alert("請輸入三個數字唷！");
                return;
            }

            // 1. 取得上下原始卦象
            const upperOrig = trigrams[a % 10] || trigrams[a % 8 || 8];
            const lowerOrig = trigrams[b % 10] || trigrams[b % 8 || 8];

            // 2. 計算動爻 (1-6)
            let dongYao = c % 6;
            if (dongYao === 0) dongYao = 6;

            // 3. 判斷因 (本) 與 果 (變)
            let cause, result;
            let logicDetail = "";

            if (dongYao >= 4) {
                // 動爻在上卦 (4,5,6)
                // 根據規則：c所在叫變卦(果)，不含c叫本卦(因)
                cause = lowerOrig; // 下卦不變為因
                // 模擬上卦變爻後的卦 (簡單版邏輯：以原始卦象名顯示，或可深化邏輯)
                // 這裡遵循圖一範例：上卦變爻後變成另一個卦
                // 為了簡化且符合圖一範例 (345 -> 上離下震, 5爻變, 上卦變乾)
                // 我們簡化處理：果 = 變爻後的上卦，因 = 原本的下卦
                // 注意：這裡假設使用者已知如何手動算出變後的卦，或由程式代勞
                // 我們暫以「變爻所在的那個位置」為「果」
                result = getChangedTrigram(upperOrig, dongYao - 3); 
                logicDetail = `第 ${dongYao} 爻動，上卦變為果`;
            } else {
                // 動爻在下卦 (1,2,3)
                cause = upperOrig; // 上卦不變為因
                result = getChangedTrigram(lowerOrig, dongYao);
                logicDetail = `第 ${dongYao} 爻動，下卦變為果`;
            }

            // 顯示結果
            document.getElementById('causeSymbol').innerText = cause.symbol;
            document.getElementById('causeName').innerText = cause.name + "卦";
            document.getElementById('causeElement').innerText = "屬" + cause.element;

            document.getElementById('resultSymbol').innerText = result.symbol;
            document.getElementById('resultName').innerText = result.name + "卦";
            document.getElementById('resultElement').innerText = "屬" + result.element;

            // 4. 生剋判斷
            const final = checkRelation(result.element, cause.element);
            document.getElementById('logicText').innerText = `${result.element}(果) ${final.text.substring(1, 2)} ${cause.element}(因)`;
            document.getElementById('finalJudgment').innerText = final.level;

            document.getElementById('resultArea').classList.remove('hidden');
        }

        // 簡易變爻邏輯 (根據陽變陰、陰變陽模擬)
        function getChangedTrigram(orig, pos) {
            // 這裡為了保持「簡單版」教學，直接根據圖一 345 的例子做邏輯轉換
            // 若上卦離(3) 5爻變 -> 變乾(1)
            // 這邊我們建立一個簡單的變爻查找表或邏輯
            const symbols = {
                "乾": "111", "兌": "011", "離": "101", "震": "001",
                "巽": "110", "坎": "010", "艮": "100", "坤": "000"
            };
            let bits = symbols[orig.name].split("");
            // 易經是由下往上數，但字串索引是 0,1,2 (對應爻 1,2,3)
            let idx = pos - 1; 
            bits[idx] = bits[idx] === "1" ? "0" : "1";
            let newBits = bits.join("");
            
            for (let k in symbols) {
                if (symbols[k] === newBits) {
                    // 找到對應的卦名後從 trigrams 取資料
                    for (let t in trigrams) {
                        if (trigrams[t].name === k) return trigrams[t];
                    }
                }
            }
            return orig;
        }
    </script>
</body>
</html>
